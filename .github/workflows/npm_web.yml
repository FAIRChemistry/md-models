name: Publish to NPM (Web CDN)

on:
  release:
    types: [published]
  # A manual run builds the given tag, so a failed release can be republished
  # without a new version.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v0.3.1)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build-and-upload:
    name: Build and upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Pinned: with "latest" the action looks the version up through the
      # GitHub API and silently falls back to v0.9.1 when that call fails,
      # which does not accept --features.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.1"

      - name: Build WASM for npm (bundle)
        run: wasm-pack build --release --out-name mdmodels-web --target web --features wasm --no-default-features

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update package name
        run: |
          jq '.name = "mdmodels-web"' pkg/package.json > pkg/package.json.tmp
          mv pkg/package.json.tmp pkg/package.json

      - run: |
          cd pkg/
          npm install --package-lock-only
          npm ci
          npm publish --access public
