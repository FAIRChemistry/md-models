name: Tests

# This workflow runs various tests across different languages and environments
# to ensure cross-platform compatibility and functionality

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'templates/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'templates/**'
      - '.github/workflows/test.yml'
env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs the core Rust unit tests for the project
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows works, but breaks minijinja
        # iterators and thus some content is
        # rendered in a different order *sigh*
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      # Property tests explore many more inputs than the default budget when
      # given room; a nightly-sized run belongs in CI, not on every save.
      - name: Run property tests with a larger case budget
        env:
          PROPTEST_CASES: "1024"
        run: cargo test --verbose --test property_tests

  # Exports one reference model to every target and validates each artefact with
  # that ecosystem's own tool, rather than with md-models itself. This is what
  # catches invalid Protobuf scalars, unbound Turtle prefixes, uncompilable XSDs
  # and malformed JSON Schema before they reach a user.
  conformance:
    name: Cross-target conformance
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system validators
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxml2-utils
      - name: Install Python validators
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install rdflib jsonschema PyYAML graphql-core pyshacl linkml-runtime
      - name: Build
        run: cargo build --release
      - name: Run conformance checks
        run: |
          for model in \
            tests/data/model.md \
            tests/data/model_recursive.md \
            tests/data/model_xsd_facets.md \
            tests/data/model_terms_wellknown.md \
            tests/data/model_primitives.md
          do
            root=$(grep -m1 '^### ' "$model" | sed 's/^### //;s/ .*//')
            echo "::group::$model (root=$root)"
            python3 tests/conformance/validate_artifacts.py \
              --model "$model" --root "$root" --strict
            echo "::endgroup::"
          done

  # Tests Go code generation and validates the output
  golang:
    name: Go
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached build
        uses: actions/cache/restore@v3
        with:
          path: |
            target
            ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Generate Go code
        run: |
          cargo run convert \
            -i tests/data/model.md \
            -o tests/envs/go/generated.go \
            -t golang

      - name: Build Docker image
        run: docker build -t gotests -f tests/envs/go/Dockerfile .
      - name: Run tests
        run: docker run --rm gotests

  # Tests Python code generation for multiple Python frameworks:
  # - dataclasses
  # - pydantic
  # - pydantic with XML support
  python:
    name: Python
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Python code
        run: |
          cargo run convert \
            -i tests/data/model.md \
            -o tests/envs/python/gen_dataclasses.py \
            -t python-dataclass

          cargo run convert \
            -i tests/data/model.md \
            -o tests/envs/python/gen_pydantic.py \
            -t python-pydantic

          cargo run convert \
            -i tests/data/model.md \
            -o tests/envs/python/gen_pydantic_xml.py \
            -t python-pydantic-xml

          cargo run convert \
            -i tests/data/model_jsonld.md \
            -o tests/envs/python/gen_pydantic_jsonld.py \
            -t python-pydantic

          cargo run convert \
            -i tests/data/model_jsonld.md \
            -o tests/envs/python/gen_shapes.ttl \
            -t shacl

      - name: Build Docker image
        run: docker build -t pythontests -f tests/envs/python/Dockerfile .
      - name: Run tests
        run: docker run --rm pythontests

  # Tests TypeScript code generation with Zod schema validation
  typescript:
    name: TypeScript Zod
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate TypeScript code
        run: |
          cargo run convert \
            -i tests/data/model.md \
            -o tests/envs/typescript/generated.ts \
            -t typescript-zod

      - name: Build Docker image
        run: docker build -t tstests -f tests/envs/typescript/Dockerfile .
      - name: Run tests
        run: docker run --rm tstests

  # Tests Julia code generation and validates the output
  julia:
    name: Julia
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached build
        uses: actions/cache/restore@v3
        with:
          path: |
            target
            ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Generate Julia code
        run: |
          cargo run convert \
            -i tests/data/model.md \
            -o tests/envs/julia/generated.jl \
            -t julia

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1.9'

      - name: Install dependencies
        run: |
          julia -e 'using Pkg; Pkg.add(["Test", "JSON3", "StructTypes"])'

      - name: Run tests
        run: |
          cd tests/envs/julia
          julia test.jl

  # Tests Rust without JSON-LD code generation and validates the output
  rust:
    name: Rust
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Rust code
        run: |
          cargo run convert \
            -i tests/data/model.md \
            -o tests/envs/rust/src/generated.rs \
            -t rust

      - name: Build Docker image
        run: docker build -t rusttests -f tests/envs/rust/Dockerfile .
      - name: Run tests
        run: docker run --rm rusttests

  # Tests Rust with JSON-LD code generation and validates the output
  rust-ld:
    name: Rust (LD)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Rust code
        run: |
          cargo run convert \
            -i tests/data/model.md \
            -o tests/envs/rust-ld/src/generated.rs \
            -O jsonld \
            -t rust

      - name: Build Docker image
        run: docker build -t rusttests -f tests/envs/rust-ld/Dockerfile .
      - name: Run tests
        run: docker run --rm rusttests

  # Tests WASM build for npm bundler target
  bundler:
    name: Bundler
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WASM for npm (bundle)
        run: wasm-pack build --target bundler --features wasm --no-default-features

  # Tests WASM build for web target
  web:
    name: Web
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WASM for npm (bundle)
        run: wasm-pack build --features wasm --no-default-features
