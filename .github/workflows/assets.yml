name: Compile and release

on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+"
  # Rebuilds the binaries of an existing release, e.g. after a failed run.
  # The workflow steps come from the branch it is started on; the source is
  # checked out at the given tag, and the binaries go to that tag's release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload binaries for (e.g. v0.3.1)"
        required: true

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin

          - build: macos
            os: macos-latest
            target: aarch64-apple-darwin

          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get the release version from the tag
        shell: bash
        run: echo "VERSION=${{ inputs.tag || github.ref_name }}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the compiler, which overrides the stable
      # toolchain installed above. Add the build target to the pinned one, or
      # cross-compiling (x86_64 on the arm64 macOS runner) finds no `core`.
      - name: Add target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --features openai --verbose --release --target ${{ matrix.target }}

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            fname="target/${{ matrix.target }}/release/md-models-${{ matrix.target }}.exe"
            mv target/${{ matrix.target }}/release/md-models.exe $fname
            echo "ASSET=$fname" >> $GITHUB_ENV
          else
            fname="target/${{ matrix.target }}/release/md-models-${{ matrix.target }}"
            mv target/${{ matrix.target }}/release/md-models $fname
            echo "ASSET=$fname" >> $GITHUB_ENV
          fi

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            ${{ env.ASSET }}
